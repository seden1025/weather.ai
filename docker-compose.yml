version: "3.9"

services:
  db:
    image: timescale/timescaledb:2.16.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_pass
      POSTGRES_DB: weather_ai
    ports:
      - "5432:5432"
    volumes:
      - weather_db_data:/var/lib/postgresql/data

volumes:
  weather_db_data:
